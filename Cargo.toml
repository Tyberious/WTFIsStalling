[package]
name = "wtfisstalling"
version = "0.7.0"
edition = "2021"
description = "Finds the driver, app or hardware behind hitches and micro-stalls on Windows"
default-run = "WTFIsStalling"
license = "MIT"
repository = "https://github.com/Tyberious/WTFIsStalling"
readme = "README.md"
keywords = ["latency", "dpc", "etw", "stutter", "diagnostics"]
categories = ["development-tools::profiling", "os::windows-apis"]

[lib]
name = "wtfis"
path = "src/lib.rs"

# The window most people use.
[[bin]]
name = "WTFIsStalling"
path = "src/bin/gui.rs"

# Same engine on the console, with tunable thresholds.
[[bin]]
name = "wtfis-cli"
path = "src/bin/cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.5"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
