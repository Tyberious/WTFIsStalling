name: Release

# Push a tag like v0.1.0 to build the executables and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: Checksums
        shell: pwsh
        run: |
          cd target/release
          Get-FileHash WTFIsStalling.exe, wtfis-cli.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/WTFIsStalling.exe
            target/release/wtfis-cli.exe
            target/release/SHA256SUMS.txt
