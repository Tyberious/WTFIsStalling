name: Bug
description: The tool crashed, hung, failed to start monitoring, or printed something clearly broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WTFIsStalling version and Windows build
      description: Both are in the first lines of any report
  - type: textarea
    id: output
    attributes:
      label: Output / report
      render: text
